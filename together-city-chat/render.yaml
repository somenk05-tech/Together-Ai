# Render Blueprint — one web service + managed Postgres + managed Redis (Key Value).
# Verify field names against current Render docs; the schema evolves.
#
# THIS IS THE ALTERNATIVE HOST, NOT THE LIVE ONE. togethercity.app's API runs on
# RAILWAY (see together-city-deployment-runbook.md — "Backend + Postgres + Redis
# → Railway", with Render listed as the alternative). Nothing deploys from this
# file today, so adding a variable HERE sets it nowhere: the runbook's
# environment-variable reference is what a real deploy is read from, and every
# variable added here must be added there too.
#
# Kept, rather than deleted, because the blueprint is genuinely the fallback if
# Railway ever has to be left in a hurry — and a stale fallback is worse than
# none.
services:
  - type: web
    name: together-city-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter                     # free tier spins down; use starter+ for production
    # THIS WAS EMPTY, with the note "no /health route yet" — which stopped being
    # true long ago. Empty means Render does a TCP port check: the instant Nest
    # binds the port the instance is "healthy" and citizens are routed onto it,
    # minutes before it can answer. /api/health now returns 503 while the recipe
    # corpus and the composer pool are still loading, so Render holds the
    # instance out of rotation — and during a deploy keeps the previous one
    # serving until the new one is genuinely ready. That is what makes a deploy
    # invisible instead of a two-minute outage on the planner.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # ── REFUSE TO START RATHER THAN START BROKEN ────────────────────────
      # NOTE: this file is the Render fallback and deploys nowhere today — the
      # live API is on Railway. The same variable is in the runbook's
      # environment reference, which is what a real deploy is read from.
      # assertProductionConfig() collects every missing production variable
      # and, without this, prints them as a banner and boots anyway. That is
      # how a deploy came up GREEN — health check and all — with the email
      # provider on its logging stub, so every verification code, recovery
      # code and receipt was written to stdout and nothing arrived. Set, the
      # same banner is a refusal, which is the only version anybody reads.
      - key: STRICT_PROD_CONFIG
        value: "true"
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false                   # set to your frontend URL, e.g. https://togethercity.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: together-city-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: together-city-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "1209600"
      # Refused at boot when unset — see the runbook's note about the three
      # variables that stop a deploy rather than degrade. It has never been in
      # this blueprint, so a Render deploy from this file could not come up
      # even with every secret filled (found by re-audit, 29 Aug).
      - key: PHOTO_MODERATION
        value: rekognition
      - key: REKOGNITION_REGION
        sync: false
      - key: REKOGNITION_ACCESS_KEY_ID
        sync: false
      - key: REKOGNITION_SECRET_ACCESS_KEY
        sync: false
      # ── PUSH ────────────────────────────────────────────────────────────
      # Web push is the whole of push on this deployment; FCM below is for a
      # native app that does not exist yet. Unset, WebPushProvider disables
      # itself and every notification is delivered to nobody, silently —
      # assertProductionConfig() now says so at boot.
      # Generate a pair with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:connect@togethercity.app
      - key: FCM_ENABLED
        value: "false"
      # ── OBJECT STORAGE ──────────────────────────────────────────────────
      # MEDIA_PRIVATE_BUCKET is not optional in production. StorageProvider
      # falls back to MEDIA_BUCKET when it is empty, which would put blood
      # tests, prescriptions, Drive files and dating photos in the bucket
      # published at MEDIA_PUBLIC_BASE_URL. assertProductionConfig() refuses
      # to boot rather than let that happen quietly, so a deploy that forgets
      # this fails loudly here instead of succeeding and leaking.
      # The inbound-mail webhook secret. POST /api/mail/inbound writes into a
      # citizen's mailbox and cannot carry a user JWT, so this is what
      # authenticates it. Unset, InboundSecretGuard refuses every call — the
      # feature is off rather than open.
      - key: RESEND_INBOUND_SECRET
        sync: false
      # ── OUTBOUND MAIL ───────────────────────────────────────────────────
      # Unset, createMessagingProvider() falls through to StubMessagingProvider,
      # which does no network I/O and reports `status: 'sent'`. Nothing is
      # delivered and nothing is wrong-looking. These three are what make the
      # difference, and they were absent from this file entirely until 29 Aug.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false                   # e.g. "Together City <hello@togethercity.app>"
      - key: MEDIA_PROVIDER
        value: r2
      - key: MEDIA_BUCKET
        sync: false                   # public bucket: post/listing images
      - key: MEDIA_PRIVATE_BUCKET
        sync: false                   # PRIVATE bucket: health, drive, dating — no public access
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false                   # public read origin for MEDIA_BUCKET only
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false                   # https://<accountid>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: together-city-db
    plan: basic-256mb                 # free plan expires after ~30 days; pick a paid plan for production
    postgresMajorVersion: "16"

  - type: keyvalue
    name: together-city-redis
    plan: starter
    ipAllowList: []                   # only reachable from your Render services
