# Together City — the Go live button.
#
# Two cities from one codebase (owner, 16 Sep):
#   develop -> dev.togethercity.app  (the developer copy, every hub)
#   main    -> togethercity.app      (the live site, the hubs chosen below)
#
# Nothing reaches `main` except through this workflow. The button on the
# developer site runs it (release.service.ts); it can also be run by hand from
# the Actions tab. It:
#   1. writes the chosen hubs into live-hubs.ts on develop,
#   2. builds the release on top of main - everything on develop, or only the
#      changes named in `commits` (owner, 16 Sep: "give an option to select
#      what can go live now"),
#   3. proves that tree applies its migrations to an empty database,
#      type-checks and builds both packages from a clean checkout,
#   4. and only then pushes develop and main together (atomic).
# A failure at any step pushes nothing, and the live site keeps what it had.
# Vercel and Railway deploy main on push, as they always have.
#
# Steps 1, 2 and 4 are release/go-live.sh, read from main - so how a release
# is made can change without editing this file.
name: Go live
run-name: "Go live - ${{ inputs.hubs }}"

on:
  workflow_dispatch:
    inputs:
      hubs:
        description: "Hubs the live site shows, comma-separated (personalize,ecommerce,services,social,astrology,babycare,beauty,dating,entertainment,family,financial,fitness,jobs,medical,nutrition,pets,realestate,travel)"
        required: true
        type: string
      reason:
        description: "Why - a sentence for the history"
        required: true
        type: string
      commits:
        description: "Only these changes (commit ids on develop, space-separated). Empty sends everything."
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Two presses never race each other onto main.
concurrency:
  group: go-live
  cancel-in-progress: false

jobs:
  release:
    name: Build develop, then move main
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: city
          POSTGRES_PASSWORD: city
          POSTGRES_DB: together_city_release
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HUBS: ${{ inputs.hubs }}
      REASON: ${{ inputs.reason }}
      COMMITS: ${{ inputs.commits }}
      DATABASE_URL: postgres://city:city@localhost:5432/together_city_release

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write the hubs onto develop, then build the release on main
        run: |
          git show origin/main:release/go-live.sh > "$RUNNER_TEMP/go-live.sh"
          bash "$RUNNER_TEMP/go-live.sh" prepare

      - name: API - migrations apply, types, build
        working-directory: together-city-chat
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx tsc --noEmit
          npm run build

      - name: Web - the same build Vercel runs
        working-directory: together-city-react
        run: |
          npm ci
          npm run build -- --base=/

      - name: Move main (and develop) together
        run: bash "$RUNNER_TEMP/go-live.sh" push
