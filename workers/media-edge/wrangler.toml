# The edge in front of the PRIVATE media bucket. See worker.js for why this
# exists at all — presigned R2 URLs only work on the S3 API host, which
# Cloudflare does not cache.
name = "together-city-media-edge"
main = "worker.js"
compatibility_date = "2026-08-01"

# The bucket stays private. This Worker is its only public door.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "together-city-private"   # set to MEDIA_PRIVATE_BUCKET's value

# THE HOST. A ROUTE, not a Custom Domain, and the difference decides what you
# have to do before deploying (checked against the docs, 1 Sep):
#
#   · A Custom Domain (`custom_domain = true`, a bare hostname, no path) makes
#     Cloudflare create the DNS record and the certificate for you — and it
#     CANNOT be created on a hostname that already has a CNAME. If media.
#     togethercity.tech is already an R2 public-bucket custom domain, that is
#     a CNAME, and this form would be refused until you disconnected it,
#     taking every public image down with it.
#
#   · A Route (below) attaches to a hostname whose proxied DNS record already
#     exists, and only for the paths in the pattern. `/m/*` is this Worker;
#     everything else on the host is untouched.
#
# The safe default is a host of its own — cdn.togethercity.tech, proxied,
# nothing else on it — because then neither question arises. Layering a route
# over a live R2 custom domain may well work; I could not find that stated in
# the docs, and an unverified claim is not worth your public media.
[[routes]]
pattern = "cdn.togethercity.tech/m/*"
zone_name = "togethercity.tech"
custom_domain = false

# LINK_SECRET is a secret, not a var:
#   wrangler secret put LINK_SECRET
# It must equal the API's JWT_ACCESS_SECRET — both derive the media key from it.
