ww.merckvetmanual.com/toxicology/food-hazards/chocolate-toxicosis-in-animals","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats"]},{name:"Chives (including spring onion greens)",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Allium species - sulfur-containing oxidants cause oxidative haemolysis and Heinz body anaemia.",symptoms:["Gastrointestinal irritation, vomiting, diarrhoea","Lethargy and weakness","Pale or yellow gums","Dark urine","Rapid breathing and heart rate"],onset:"Delayed - haemolysis typically 3-5 days after exposure.",whatToDo:"Emergency vet or poison control the same day.",speciesNote:"ASPCA notes cats are more susceptible than dogs to Allium species. Chive-flavoured cream cheese and spring onion garnishes are common accidental exposures.",sources:["https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals","https://vcahospitals.com/know-your-pet/onion-garlic-chive-and-leek-toxicity-in-dogs"]},{name:"Cooked bones (chicken, mutton, fish, chop bones)",affects:"Both",severity:"SEVERE",dose:"Not a dose-dependent poison - a single bone can be fatal. DATA NOT VERIFIED.",mechanism:"Mechanical, not chemical: hard and brittle bone fractures teeth and splinters into sharp shards that lacerate, perforate or obstruct the gastrointestinal tract.",symptoms:["Choking, gagging, pawing at the mouth","Drooling, blood in the mouth","Repeated vomiting or retching","Abdominal pain and a hunched posture","Straining to defecate, constipation, rectal bleeding","Lethargy and collapse if perforation and peritonitis occur"],onset:"Immediate for choking and oral injury; hours to days for obstruction or perforation.",whatToDo:"Emergency vet - do NOT induce vomiting, because a sharp fragment can do more damage coming back up.",speciesNote:"VCA lists seven distinct dangers (broken teeth, mouth and tongue injuries, choking, gut perforation, stomach retention, intestinal blockage, bacterial contamination) and states it is a myth that dogs need to chew bones. PetMD says chicken bones must never be given to cats. Cats' smaller GI tract makes obstruction from even a small fragment more likely.",sources:["https://vcahospitals.com/know-your-pet/why-bones-are-not-safe-for-dogs","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.petmd.com/cat/nutrition/can-cats-eat-chicken"]},{name:"Garlic (raw, cooked, powdered, garlic paste, garlic supplements)",affects:"Both",severity:"SEVERE",dose:"Merck states garlic is 3-5 times more toxic than onion. An absolute g/kg threshold for garlic itself: DATA NOT VERIFIED, but it can be scaled from the onion figures (dogs 15-30 g/kg raw onion; cats 5 g/kg raw onion or less than a teaspoon of cooked onion).",mechanism:"Same as onion - sulfur-containing oxidants in Allium species cause oxidative red blood cell damage, Heinz body formation, methaemoglobinaemia and haemolysis.",symptoms:["Lethargy, weakness, exercise intolerance","Anorexia","Rapid breathing and heart rate","Pale or yellow gums","Dark urine","Vomiting and diarrhoea","Collapse and death"],onset:"As for onion - Heinz bodies within 24 hours peaking around 72 hours, haemolysis typically 3-5 days after exposure.",whatToDo:"Contact a vet or poison control the same day, including for 'small' amounts of garlic paste or powder, because garlic is several times more potent than onion by weight.",speciesNote:"Cats are the most susceptible species. Reject any folk or 'natural flea remedy' advice to feed garlic to dogs - the cited veterinary sources classify it as a toxin, not a supplement. Ginger-garlic paste, garlic naan, garlic chutney and hing-garlic tadka are all routes of exposure in Indian kitchens.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals","https://www.petpoisonhelpline.com/poison/garlic/","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets"]},{name:"High-fat, fried and buttery/ghee-laden foods (pakora, puri, samosa, butter, ghee, refried or oily leftovers)",affects:"Both",severity:"SEVERE",dose:null,mechanism:"A sudden high-fat load triggers inappropriate pancreatic enzyme activation and pancreatic inflammation (pancreatitis), and causes acute gastroenteritis.",symptoms:["Vomiting and diarrhoea, sometimes lasting up to four days","Abdominal pain and a hunched posture","Loss of appetite","Lethargy"],onset:"Typically within hours to a day of the fatty meal. A precise interval: DATA NOT VERIFIED.",whatToDo:"Vet the same day if there is repeated vomiting, abdominal pain or refusal to eat - pancreatitis can be severe and needs fluids, pain control and antiemetics.",speciesNote:"Affects both species; PetMD documents pancreatitis risk from fatty foods in dogs and has separate guidance on feeding cats with pancreatitis. Schnauzers are specifically named by PetMD as predisposed. This is the most common festival-season emergency in Indian households - Diwali mithai and fried snacks fed as 'a little treat'.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-butter","https://www.petmd.com/dog/nutrition/can-dogs-eat-nuts","https://www.petmd.com/dog/nutrition/what-can-dogs-not-eat"]},{name:"Leeks",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Leeks are an Allium species; sulfur-containing oxidants cause oxidative red blood cell damage, Heinz bodies and haemolytic anaemia.",symptoms:["Lethargy and weakness","Pale or icteric gums","Dark urine","Tachypnoea, tachycardia","Vomiting and diarrhoea"],onset:"Delayed - haemolysis typically 3-5 days after exposure.",whatToDo:"Emergency vet or poison control the same day.",speciesNote:"Cats are the most susceptible species to Allium toxicosis. VCA's dog page covers onion, garlic, chive and leek together as a single toxic group.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals","https://vcahospitals.com/know-your-pet/onion-garlic-chive-and-leek-toxicity-in-dogs","https://www.petmd.com/dog/nutrition/what-vegetables-can-dogs-eat"]},{name:"Mouldy food and mouldy nuts",affects:"Both",severity:"SEVERE",dose:null,mechanism:"DATA NOT VERIFIED - PetMD states moulded nuts are toxic but does not name the toxin or mechanism.",symptoms:["DATA NOT VERIFIED - the cited source does not enumerate clinical signs"],onset:null,whatToDo:"Call a vet or poison control immediately if a pet has eaten mouldy food, especially if there are tremors or agitation.",speciesNote:"PetMD's dog nut guidance names mouldy nuts as toxic. Feline data: DATA NOT VERIFIED. Practical rule: bins, compost and monsoon-damp stored grain and nuts should be inaccessible. Evidence strength here is weaker than for the top-tier toxins in this list.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-nuts"]},{name:"Onion (raw, cooked, powdered, dehydrated, fried)",affects:"Both",severity:"SEVERE",dose:"Merck: in dogs, ingestion of 15-30 g/kg of raw onion has resulted in clinical signs. In cats, toxicosis has been reported after ingesting less than a teaspoon of cooked onions or 5 g/kg of raw onion.",mechanism:"Sulfur-containing oxidants in Allium species cause oxidative damage to red blood cells, producing Heinz bodies, methaemoglobinaemia and haemolytic anaemia.",symptoms:["Lethargy and weakness","Anorexia","Tachypnoea and tachycardia","Exercise intolerance","Pale or icteric (yellow) gums","Dark red or brown urine (haemoglobinuria)","Vomiting, diarrhoea, abdominal pain","Collapse and death"],onset:"Heinz body formation and methaemoglobinaemia begin within 24 hours and peak around 72 hours; haemolysis typically occurs 3-5 days after exposure, so clinical signs usually appear days later, not immediately (Merck).",whatToDo:"Contact a vet or poison control the same day even if the animal looks fine - the damage is delayed; do not wait for symptoms and do not induce vomiting unless instructed.",speciesNote:"Merck states cats are the most susceptible species, followed by dogs, and are particularly vulnerable to concentrated forms like onion powder and dehydrated onion. This is the single most important toxin for Indian households - onion is in nearly every sabzi, dal tadka, curry, biryani, sambar and gravy. Onion powder is also hidden in stock cubes, chips, namkeen and instant noodle masala sachets.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals","https://vcahospitals.com/know-your-pet/onion-garlic-chive-and-leek-toxicity-in-dogs","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats"]},{name:"Raw and undercooked meat, poultry, fish, eggs and unpasteurised dairy",affects:"Both",severity:"SEVERE",dose:"Not dose-dependent - a single contaminated portion can cause infection. DATA NOT VERIFIED.",mechanism:"Bacterial and parasitic contamination - Salmonella, Campylobacter, E. coli, Listeria monocytogenes, Toxoplasma and, in raw salmonid fish, the fluke that transmits Neorickettsia. Raw egg white additionally contains avidin, which binds biotin and interferes with its absorption.",symptoms:["Poor appetite, lethargy","Abdominal pain","Vomiting and diarrhoea","Fever","With salmon poisoning disease in dogs: fever, vomiting, diarrhoea, enlarged lymph nodes, and death within about two weeks if untreated","With chronic raw egg feeding: skin and coat problems from biotin interference"],onset:"Varies by pathogen. Salmon poisoning disease is typically fatal within two weeks if untreated (VCA).",whatToDo:"See a vet if there is vomiting, diarrhoea, fever or lethargy after a raw meal; mention the raw feeding explicitly, because salmon poisoning in dogs is treatable but only if it is suspected.",speciesNote:"AVMA discourages feeding any raw or undercooked animal-sourced protein to dogs and cats because of risk to both human and animal health, noting healthy pets can shed pathogens subclinically and infect children, elderly, pregnant and immunocompromised household members. Cornell adds that raw meat is not recommended for cats because it is a potential vehicle for toxoplasmosis. VCA notes cats do not appear to develop salmon poisoning disease - that one is dog-specific.",sources:["https://www.avma.org/resources-tools/avma-policies/raw-or-undercooked-animal-source-protein-cat-and-dog-diets","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center/health-information/feline-health-topics/feeding-your-cat","https://vcahospitals.com/know-your-pet/salmon-poisoning","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats"]},{name:"Salt and salty snacks (namkeen, chips, papad, salt dough, de-icing salt, sea water)",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Excess sodium causes hypernatraemia; water shifts out of brain cells, producing neurological signs, and severe cases cause cerebral oedema on rehydration.",symptoms:["Increased thirst and urination","Vomiting and diarrhoea","Depression and disorientation","Stumbling gait / incoordination","Tremors","Seizures","Collapse and death"],onset:null,whatToDo:"Emergency vet - correction of hypernatraemia must be done slowly and under supervision; do not force water or withhold it without veterinary direction.",speciesNote:"Applies to both species. Pet Poison Helpline additionally warns that salt and salt water must never be used to induce vomiting in an animal because of the risk of creating salt poisoning. In India the common exposures are namkeen, chips, papad, pickle brine and leftover salted curry.",sources:["https://www.petpoisonhelpline.com/poison/salt/","https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.petmd.com/dog/nutrition/what-can-dogs-not-eat"]},{name:"Shallots",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Shallots are an Allium species - the same sulfur-containing oxidants damage red blood cells and cause Heinz body haemolytic anaemia.",symptoms:["Lethargy, weakness","Pale or yellow gums","Dark urine","Rapid breathing and heart rate","Vomiting and diarrhoea","Collapse"],onset:"Delayed - haemolysis typically 3-5 days after exposure.",whatToDo:"Emergency vet or poison control the same day; do not wait for symptoms.",speciesNote:"Cats are the most susceptible Allium species. In India shallots are sold as sambar onion / chotta pyaz / madras onion and appear in sambar, chutney and South Indian gravies - they are just as dangerous as large onions.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/garlic-and-onion-allium-spp-toxicosis-in-animals","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats"]},{name:"Star fruit (kamrakh / carambola)",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Soluble oxalate / oxalic acid, present in dangerous concentrations in sour star fruit, binds calcium causing acute hypocalcaemia and calcium oxalate crystal deposition in the kidneys.",symptoms:["Vomiting and drooling","Weakness and trembling","Reduced blood calcium","Excessive urination with calcium oxalate crystals","Kidney damage"],onset:null,whatToDo:"Emergency vet - hypocalcaemia and acute kidney injury need immediate treatment and monitoring.",speciesNote:"Pet Poison Helpline lists dogs, cats and potentially humans as affected. It notes sweet varieties contain minimal oxalate and pose no risk to pets with healthy kidneys, while sour star fruit is the dangerous one - a meaningful distinction because kamrakh sold in India is often the sour type. Animals with existing kidney disease are at far greater risk.",sources:["https://www.petpoisonhelpline.com/poison/starfruit/"]},{name:"Tamarind and cream of tartar (tartaric acid sources)",affects:"Both",severity:"SEVERE",dose:null,mechanism:"Tartaric acid, the same compound implicated in grape and raisin toxicosis, accumulates in canine proximal renal tubular cells and causes acute kidney injury.",symptoms:["Vomiting and diarrhoea","Poor appetite and lethargy","Increased thirst","Reduced urine production","Acute kidney failure"],onset:"By analogy with grape toxicosis: GI signs within 6-12 hours, renal changes within 24-72 hours. Tamarind-specific onset: DATA NOT VERIFIED.",whatToDo:"Contact a vet or poison control the same day; do not wait for symptoms.",speciesNote:"Merck's toxicosis entry is titled for grape, raisin AND tamarind (Tamarindus spp) in dogs, and PetMD's feline toxic-foods page groups grapes, raisins, tamarinds and cream of tartar together as tartaric acid sources dangerous to cats. This matters enormously in India: imli is in sambar, rasam, chutney, pani puri water and many curries.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/grape-raisin-and-tamarind-vitis-spp-tamarindus-spp-toxicosis-in-dogs","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats"]},{name:"Avocado (pit, skin and leaves in particular)",affects:"Both",severity:"MODERATE",dose:null,mechanism:"Persin, present throughout the plant with leaves most toxic, causes myocardial damage in sensitive species. In dogs the dominant documented hazard is mechanical - the intact pit causing foreign body obstruction - plus GI upset.",symptoms:["Vomiting and diarrhoea (dogs, per ASPCA)","In severe/sensitive species: lethargy, respiratory distress, subcutaneous oedema, cyanosis, cough, exercise intolerance","With pit ingestion: repeated vomiting, anorexia, abdominal pain - signs of GI obstruction"],onset:"Merck reports signs within 24-48 hours in susceptible species; obstruction from a swallowed pit may present over hours to days.",whatToDo:"Call a vet or poison control; if the pit was swallowed treat it as a possible surgical obstruction and go in for imaging. Do not induce vomiting for a swallowed pit unless instructed.",speciesNote:"SOURCES DISAGREE on how dangerous avocado flesh is to dogs and cats. Merck says dogs seem relatively resistant, citing one report of two dogs with myocardial damage, and does not address cats. Pet Poison Helpline states outright that avocado is non-toxic to dogs and cats and that the pit obstruction is the real risk. ASPCA says persin can cause vomiting and diarrhoea in dogs and that avocado is primarily a problem for birds, rabbits, donkeys, horses and ruminants. PetMD's fruit guide allows very small amounts of soft green flesh for dogs but says the pit, skin and leaves must always be avoided. Practical reading: flesh is a low-grade GI/fat risk, the pit is the emergency.",sources:["https://www.merckvetmanual.com/toxicology/food-hazards/avocado-persea-spp-toxicosis-in-animals","https://www.petpoisonhelpline.com/poison/avocado/","https://www.aspca.org/news/scoop-avocado-and-your-pets","https://www.petmd.com/dog/nutrition/what-fruits-can-dogs-eat"]},{name:"Blue cheese and other mouldy cheese",affects:"Dog",severity:"MODERATE",dose:null,mechanism:"PetMD states blue cheese contains roquefortine, which is toxic to dogs.",symptoms:["DATA NOT VERIFIED - the cited source names the toxin but does not enumerate clinical signs"],onset:null,whatToDo:"Call a vet or poison control with the amount eaten; do not induce vomiting unless instructed.",speciesNote:"PetMD's guidance is written for dogs and says to avoid blue cheese entirely. Feline data: DATA NOT VERIFIED. Note that PetMD separately warns moulded nuts are toxic, so the general rule is to keep all visibly mouldy food away from pets.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-cheese","https://www.petmd.com/dog/nutrition/can-dogs-eat-nuts"]},{name:"Citrus peel, pith, seeds, stems and leaves (nimbu, santra, mosambi)",affects:"Both",severity:"MODERATE",dose:null,mechanism:"Stems, leaves, peels, fruit and seeds contain varying amounts of citric acid and essential oils that irritate the gastrointestinal tract and, in quantity, can cause central nervous system depression.",symptoms:["Vomiting and diarrhoea","Excessive drooling","Trembling","Light sensitivity","Lethargy and depression","Skin irritation"],onset:null,whatToDo:"Call a vet if a large amount of peel, or any whole lemon/lime, has been eaten - whole citrus can also obstruct.",speciesNote:"ASPCA says small amounts of the flesh are likely to cause only minor stomach upset in both species; PetMD's cat page similarly says citrus flesh is safe but the skins are irritating, and PetMD's dog fruit guide says lemons and limes should be avoided completely. The risk sits with peel, essential oils and quantity rather than a stray segment of orange.",sources:["https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.petmd.com/cat/nutrition/toxic-foods-for-cats","https://www.petmd.com/dog/nutrition/what-fruits-can-dogs-eat"]},{name:"Green/unripe tomato, tomato leaves and stems (tomato plant)",affects:"Both",severity:"MODERATE",dose:null,mechanism:"Toxic plant alkaloids (solanine-type glycoalkaloids) are found in all parts of the tomato plant; concentrations are highest in green tomatoes, leaves and stems and lowest in ripe fruit.",symptoms:["Vomiting and diarrhoea","Weakness and lethargy","Disorientation","Stumbling / incoordination"],onset:null,whatToDo:"Call a vet or poison control with an estimate of how much plant material was eaten; supportive care is usually sufficient.",speciesNote:"Affects both dogs and cats. Ripe tomato flesh contains the least alkaloid and PetMD lists ripe tomato (stems and leaves removed) as safe for dogs; the danger is the green fruit and the plant itself, which matters for households with a terrace or balcony tomato plant.",sources:["https://www.petpoisonhelpline.com/poison/tomato-plant/","https://www.petmd.com/dog/nutrition/what-fruits-can-dogs-eat"]},{name:"Macadamia nuts",affects:"Dog",severity:"MODERATE",dose:null,mechanism:"Unknown. Pet Poison Helpline states the toxic mechanism is unknown but can affect nerve and muscle function; the high oil content can additionally trigger pancreatitis.",symptoms:["Weakness, particularly hind limb weakness and inability to walk","Incoordination","Depression and severe lethargy","Vomiting","Tremors","Hyperthermia / increased body temperature","Joint stiffness"],onset:"Symptoms usually appear within 12 hours of ingestion, with recovery expected within 24-72 hours (ASPCA); Merck says signs resolve within 12-48 hours.",whatToDo:"Call a vet or poison control - most dogs recover with supportive care, but hyperthermia and inability to walk need veterinary assessment.",speciesNote:"Merck lists dogs as the only susceptible species. Effects in cats: DATA NOT VERIFIED, though PetMD's cat guidance advises avoiding nuts, especially macadamia and walnuts, for cats.",sources:["https://www.aspca.org/pet-care/animal-poison-control/people-foods-avoid-feeding-your-pets","https://www.merckvetmanual.com/special-pet-topics/poisoning/food-hazards","https://www.petpoisonhelpline.com/poison/macadamia-nuts/","https://www.petmd.com/cat/nutrition/what-human-foods-can-cats-eat"]},{name:"Nutmeg (jaiphal) and nutmeg-containing spice mixes",affects:"Both",severity:"MODERATE",dose:null,mechanism:"DATA NOT VERIFIED - the cited sources flag nutmeg as an ingredient to keep away from dogs without stating the toxic principle or mechanism.",symptoms:["DATA NOT VERIFIED - the cited sources do not enumerate clinical signs for nutmeg in dogs or cats"],onset:null,whatToDo:"Call a vet or Pet Poison Helpline / ASPCA Animal Poison Control with the amount ingested; do not induce vomiting unless instructed.",speciesNote:"PetMD lists nutmeg among the toxic ingredients that must not be in bread given to dogs, and lists gingerbread and pumpkin bread as unsafe specifically because they contain nutmeg. Cat-specific data: DATA NOT VERIFIED. Relevant in India because jaiphal appears in garam masala, biryani masala, kheer and sweets. Treat as avoid, but note that the strength of published evidence here is weaker than for the Allium, chocolate and xylitol entries.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-bread"]},{name:"Raw and undercooked kidney beans (rajma)",affects:"Both",severity:"MODERATE",dose:null,mechanism:"PetMD states raw kidney beans are toxic and contain high levels of phytohaemagglutinin, a lectin.",symptoms:["Upset stomach","Vomiting","Diarrhoea"],onset:null,whatToDo:"Call a vet if a significant amount of raw or undercooked rajma has been eaten, or if vomiting and diarrhoea are severe or persistent.",speciesNote:"PetMD's beans guidance is written for dogs and specifies that kidney beans are safe only when cooked; the same lectin concern is a reason not to feed cats raw or undercooked legumes either. Highly relevant in Indian kitchens where dry rajma is soaked on the counter overnight and is reachable.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-beans"]},{name:"Raw, green or sprouted potato and potato plant leaves",affects:"Both",severity:"MODERATE",dose:null,mechanism:"Solanine, a glycoalkaloid concentrated in green skin, sprouts and the leaves and stems of the potato plant.",symptoms:["Vomiting","Diarrhoea","Lethargy"],onset:null,whatToDo:"Call a vet or poison control with an estimate of the amount; do not induce vomiting unless instructed.",speciesNote:"Applies to both species. PetMD states raw potato should never be given to dogs and any green parts must be removed because they contain solanine. Plain cooked, peeled, non-green potato is a different matter and is treated as acceptable in small amounts.",sources:["https://www.petmd.com/dog/nutrition/can-dogs-eat-potatoes","https://www.petpoisonhelpline.com/poison/tomato-plant/"]}];function
