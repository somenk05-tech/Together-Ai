<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Together City — offline</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #faf9f6; color: #0f1012;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 340px; }
  .mark { font-size: 56px; font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #4a4a48; }
  a.retry {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    background: #0f1012; color: #faf9f6; text-decoration: none;
    font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">TC</div>
    <h1>You're offline</h1>
    <p>Together City needs an internet connection. Nothing has been lost — reconnect and try again.</p>
    <a class="retry" href="https://togethercity.app">Try again</a>
  </div>
</body>
</html>
